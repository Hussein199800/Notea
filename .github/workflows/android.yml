# Notea Android CI: tests on every push/PR; signed per-ABI release published once per version from main.
# Secrets (Settings → Secrets and variables → Actions):
#   NOTEA_KEYSTORE_BASE64  base64 of the release .jks (never committed)
#   NOTEA_KEYSTORE_PASSWORD, NOTEA_KEY_ALIAS, NOTEA_KEY_PASSWORD
# Without them the job builds a debug APK as a run artifact only (never published).
name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (incl. version match, update rules, screenshots smoke)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Read version
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Restore signing key (temporary file, deleted at the end)
        id: key
        env:
          KS_B64: ${{ secrets.NOTEA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/notea.jks"
            echo "path=$RUNNER_TEMP/notea.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets: building a debug APK only (not published)."
          fi

      - name: Build signed release APKs (per ABI + universal)
        if: steps.key.outputs.signed == 'true'
        env:
          NOTEA_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          NOTEA_KEYSTORE_PASSWORD: ${{ secrets.NOTEA_KEYSTORE_PASSWORD }}
          NOTEA_KEY_ALIAS: ${{ secrets.NOTEA_KEY_ALIAS }}
          NOTEA_KEY_PASSWORD: ${{ secrets.NOTEA_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p dist
          out=app/build/outputs/apk/release
          cp "$out/app-universal-release.apk"   dist/Notea.apk
          cp "$out/app-arm64-v8a-release.apk"   dist/Notea-arm64-v8a.apk
          cp "$out/app-armeabi-v7a-release.apk" dist/Notea-armeabi-v7a.apk
          # Every APK must be signed with the same certificate.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in dist/*.apk; do "$apksigner" verify --print-certs "$f" | grep -m1 "SHA-256"; done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/notea.jks"

      - name: Build debug APK (no secrets)
        if: steps.key.outputs.signed != 'true'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APKs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notea-${{ steps.ver.outputs.version }}-${{ steps.key.outputs.signed == 'true' && 'release' || 'debug' }}
          path: |
            dist/*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Publish GitHub release (main only, once per version)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — not publishing again."
            exit 0
          fi
          gh release create "$tag" dist/Notea.apk dist/Notea-arm64-v8a.apk dist/Notea-armeabi-v7a.apk dist/SHA256SUMS.txt \
            --title "Notea $VERSION" --notes-file release-notes.md --latest
